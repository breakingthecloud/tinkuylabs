<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="system-ui, -apple-system, sans-serif">
  <rect width="760" height="420" fill="#0f172a" rx="12"/>
  <text x="380" y="36" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="600">Sayay + Styrr Strands Agent — Bedrock AgentCore</text>

  <!-- Step Functions -->
  <rect x="20" y="70" width="160" height="90" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="100" y="105" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="600">Step Functions</text>
  <text x="100" y="125" text-anchor="middle" fill="#94a3b8" font-size="11">loop control + Catch block</text>
  <text x="100" y="142" text-anchor="middle" fill="#64748b" font-size="10">ErrorEquals: TokenBudgetExceeded</text>

  <!-- Sayay -->
  <rect x="220" y="70" width="160" height="90" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="300" y="105" text-anchor="middle" fill="#fcd34d" font-size="14" font-weight="600">Sayay Guard</text>
  <text x="300" y="125" text-anchor="middle" fill="#94a3b8" font-size="11">checkOrThrow() before</text>
  <text x="300" y="142" text-anchor="middle" fill="#94a3b8" font-size="11">record() after</text>

  <!-- Styrr -->
  <rect x="420" y="70" width="160" height="90" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="500" y="105" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="600">Styrr Router</text>
  <text x="500" y="125" text-anchor="middle" fill="#94a3b8" font-size="11">ordered fallback chain</text>
  <text x="500" y="142" text-anchor="middle" fill="#64748b" font-size="10">bedrock → external → free</text>

  <!-- Strands Agent -->
  <rect x="590" y="70" width="150" height="90" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="665" y="105" text-anchor="middle" fill="#86efac" font-size="14" font-weight="600">Strands Agent</text>
  <text x="665" y="125" text-anchor="middle" fill="#94a3b8" font-size="11">probabilistic step</text>
  <text x="665" y="142" text-anchor="middle" fill="#94a3b8" font-size="11">Strands Agent</text>

  <!-- DynamoDB -->
  <rect x="220" y="220" width="160" height="70" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="300" y="252" text-anchor="middle" fill="#7dd3fc" font-size="13" font-weight="600">DynamoDB Ledger</text>
  <text x="300" y="270" text-anchor="middle" fill="#64748b" font-size="10">DynamoStorage adapter</text>

  <!-- Bedrock/OpenRouter boxes -->
  <rect x="420" y="220" width="160" height="70" rx="10" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
  <text x="500" y="252" text-anchor="middle" fill="#f9a8d4" font-size="13" font-weight="600">Bedrock Models</text>
  <text x="500" y="270" text-anchor="middle" fill="#64748b" font-size="10">claude-3-sonnet (IAM)</text>

  <rect x="590" y="220" width="150" height="70" rx="10" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
  <text x="665" y="252" text-anchor="middle" fill="#f9a8d4" font-size="13" font-weight="600">OpenRouter</text>
  <text x="665" y="270" text-anchor="middle" fill="#64748b" font-size="10">o1 / llama-3.3:free</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>

  <line x1="180" y1="115" x2="220" y2="115" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="115" x2="420" y2="115" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="115" x2="590" y2="115" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="300" y1="160" x2="300" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="160" x2="500" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="665" y1="160" x2="665" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- legend -->
  <text x="380" y="360" text-anchor="middle" fill="#94a3b8" font-size="12">On block: TokenBudgetExceededException → ASL Catch → kill switch (no retries, no bill)</text>
</svg>
